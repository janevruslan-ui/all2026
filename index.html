<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ИИ-художник (Исправленный)</title>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.18.0/dist/ort.min.js"></script>
<style>
  html, body { margin:0; padding:0; min-height:100%; background:#111; color:#fff; font-family:Arial, sans-serif; text-align:center; }
  h2 { margin:16px 0 4px; font-size:20px; }
  .sub { color:#aaa; font-size:13px; margin-bottom:12px; padding:0 16px; }
  #wrap { max-width:420px; margin:0 auto; }
  canvas { max-width:100%; max-height:58vh; border-radius:12px; border:1px solid #333; background:#000; }
  .styles, .sizes { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin:10px 0 6px; }
  .styles button, .sizes button { padding:10px 14px; font-size:13px; background:#2a2a2a; border:1px solid #444; border-radius:30px; color:#fff; cursor:pointer; }
  .styles button.active { background:#3742fa; border-color:#3742fa; }
  .sizes button.active { background:#2ed573; border-color:#2ed573; color:#111; }
  .btns { margin:6px 0 10px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  button.main { padding:14px 24px; border:none; border-radius:40px; color:#fff; font-size:15px; font-weight:bold; cursor:pointer; }
  #btnPick { background:#e94560; }
  #btnSave { background:#2ed573; color:#111; }
  button:disabled { opacity:.45; cursor:default; }
  #status { color:#2ed573; font-size:14px; min-height:20px; padding:0 16px; word-break:break-word; }
  #spinner { display:none; width:26px; height:26px; margin:10px auto 16px; border:3px solid #333; border-top-color:#2ed573; border-radius:50%; animation:spin 1s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>

<h2>ИИ-художник 🎨</h2>
<div class="sub">Исправлена ошибка размеров. Работает на Chrome.</div>

<div class="styles" id="styles">
  <button data-style="jp" class="active">Аниме (лица)</button>
  <button data-style="hayao">Миядзаки</button>
  <button data-style="shinkai">Синкай</button>
</div>
<div class="sizes" id="sizes">
  <button data-size="384">Быстро (384px)</button>
  <button data-size="512" class="active">Качественно (512px)</button>
</div>

<div id="wrap">
  <canvas id="c" width="512" height="512"></canvas>
</div>

<div class="btns">
  <button id="btnPick" class="main" onclick="document.getElementById('file').click()">📂 Выбрать фото</button>
  <button id="btnSave" class="main" onclick="savePhoto()">💾 Сохранить</button>
</div>

<div id="spinner"></div>
<div id="status">Выберите фото из галереи</div>

<input type="file" id="file" accept="image/*" style="display:none">

<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d', { willReadFrequently: true });
const statusEl = document.getElementById('status');
const spinner = document.getElementById('spinner');
const btnPick = document.getElementById('btnPick');
const btnSave = document.getElementById('btnSave');

// Ссылки на модели
const MODELS = {
  jp:      'https://huggingface.co/vumichien/AnimeGANv3_JP_face/resolve/main/AnimeGANv3_JP_face.onnx',
  hayao:   'https://github.com/TachibanaYoshino/AnimeGANv3/releases/download/v1.1.0/AnimeGANv3_Hayao_36.onnx',
  shinkai: 'https://github.com/TachibanaYoshino/AnimeGANv3/releases/download/v1.1.0/AnimeGANv3_Shinkai_37.onnx'
};

let currentStyle = 'jp';
let currentSize  = 512;
let session = null, sessionKey = null;
let imgObj = null, processing = false;

// Настройка ONNX Runtime
ort.env.wasm.wasmPaths = 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.18.0/dist/';
ort.env.wasm.numThreads = 1;
ort.env.wasm.proxy = false;

function setStatus(t) { statusEl.textContent = t || ''; }
function busy(on) {
  spinner.style.display = on ? 'block' : 'none';
  btnPick.disabled = on; 
  processing = on;
}

// Переключатели
document.querySelectorAll('#styles button').forEach(b => {
  b.addEventListener('click', () => {
    if (processing) return;
    document.querySelectorAll('#styles button').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    currentStyle = b.dataset.style;
    session = null; // Сброс сессии при смене стиля
    if (imgObj) processPhoto();
  });
});
document.querySelectorAll('#sizes button').forEach(b => {
  b.addEventListener('click', () => {
    if (processing) return;
    document.querySelectorAll('#sizes button').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    currentSize = +b.dataset.size;
    if (imgObj) processPhoto();
  });
});

// Загрузка фото
document.getElementById('file').addEventListener('change', e => {
  const file = e.target.files;
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
      imgObj = img;
      drawCover(ctx, img, c.width, c.height);
      processPhoto();
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
});

// Функция вписывания фото (Cover)
function drawCover(targetCtx, img, W, H) {
  const scale = Math.max(W / img.width, H / img.height);
  const sw = W / scale, sh = H / scale;
  targetCtx.clearRect(0, 0, W, H);
  targetCtx.drawImage(img, (img.width - sw) / 2, (img.height - sh) / 2, sw, sh, 0, 0, W, H);
}

// Загрузка модели
async function loadSession(style) {
  if (session && sessionKey === style) return;
  setStatus('Скачиваю ИИ-модель (~8 МБ)...');
  busy(true);
  try {
    // Важно: executionProviders: ['wasm'] гарантирует работу в браузере
    session = await ort.InferenceSession.create(MODELS[style], { executionProviders: ['wasm'] });
    sessionKey = style;
  } catch (err) {
    console.error(err);
    setStatus('Ошибка загрузки модели. Проверьте интернет.');
    throw err;
  } finally {
    busy(false);
  }
}

// Обработка фото (ИСПРАВЛЕНО)
async function processPhoto() {
  if (!imgObj || processing) return;
  
  try {
    await loadSession(currentStyle);
  } catch (err) {
    return;
  }

  busy(true);
  setStatus('Нейросеть рисует... Это может занять до минуты.');
  await new Promise(r => setTimeout(r, 50));

  try {
    const S = currentSize;

    // 1. Создаем временный холст нужного размера и рисуем туда фото
    const snap = document.createElement('canvas');
    snap.width = S; snap.height = S;
    const snapCtx = snap.getContext('2d', { willReadFrequently: true });
    drawCover(snapCtx, imgObj, S, S);

    // 2. Получаем данные пикселей
    const imageData = snapCtx.getImageData(0, 0, S, S);
    const data = imageData.data;
    const n = S * S;

    // 3. ФОРМИРУЕМ ТЕНЗОР ПРАВИЛЬНО (NCHW)
    // Ожидаемый формат модели: [Batch, Channels, Height, Width] -> [1, 3, 512, 512]
    // Мы берем пиксели (RGBA) и раскладываем их в массив: сначала все R, потом все G, потом все B
    const input = new Float32Array(1 * 3 * n);
    
    for (let i = 0; i < n; i++) {
      const offset = i * 4;
      // Нормализация: (pixel / 127.5) - 1.0. Это переводит диапазон [0, 255] в [-1, 1]
      input[i]             = (data[offset]     / 127.5) - 1.0;       // R
      input[i + n]         = (data[offset + 1] / 127.5) - 1.0;       // G
      input[i + 2 * n]     = (data[offset + 2] / 127.5) - 1.0;       // B
      // Alpha канал игнорируется
    }

    // 4. Создаем тензор с правильной формой
    const tensor = new ort.Tensor('float32', input, [1, 3, S, S]);
    
    // 5. Запускаем инференс
    const feeds = {};
    feeds[session.inputNames] = tensor;
    const results = await session.run(feeds);
    const out = results[session.outputNames].data;

    // 6. Обратное преобразование в картинку
    const outImg = ctx.createImageData(S, S);
    const od = outImg.data;
    
    for (let i = 0; i < n; i++) {
      const offset = i * 4;
      // Денормализация: (value + 1) * 127.5
      od[offset]     = Math.max(0, Math.min(255, (out[i]         + 1) * 127.5));
      od[offset + 1] = Math.max(0, Math.min(255, (out[i + n]     + 1) * 127.5));
      od[offset + 2] = Math.max(0, Math.min(255, (out[i + 2 * n]  + 1) * 127.5));
      od[offset + 3] = 255; // Непрозрачность
    }

    // Обновляем холст
    c.width = S; c.height = S;
    ctx.putImageData(outImg, 0, 0);

    setStatus('Готово! Сохраняйте результат.');
    busy(false);
    btnSave.disabled = false;

  } catch (err) {
    busy(false);
    console.error(err);
    setStatus('Ошибка обработки: ' + (err.message || err));
  }
}

function savePhoto() {
  if (!imgObj) return;
  c.toBlob(blob => {
    const a = document.createElement('a');
    a.download = 'ai_portrait_' + Date.now() + '.png';
    a.href = URL.createObjectURL(blob);
    a.click();
  }, 'image/png');
}
</script>
</body>
</html>
