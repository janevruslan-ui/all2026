<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ИИ-художник</title>
<style>
  body{margin:0;background:#0b0b10;color:#eee;font-family:system-ui,sans-serif;padding:12px}
  h1{font-size:1.4rem;margin:6px 0}
  .sub{color:#8f9;font-size:.85rem;margin:4px 0 10px}
  .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0}
  .pill{border:none;border-radius:999px;padding:10px 16px;background:#2a2a33;color:#eee;font-size:.95rem}
  .pill.on{background:#3a5cff;color:#fff}
  #sizes .pill.on{background:#2bb673;color:#06281a}
  #stage{width:100%;background:#000;border-radius:14px;min-height:44vw;display:block}
  .big{display:block;width:100%;max-width:420px;margin:12px auto;padding:14px;border:none;border-radius:999px;font-size:1.05rem}
  #pick{background:#ff4d6d;color:#fff}
  #save{background:#2bb673;color:#06281a}
  #status{text-align:center;min-height:1.4em;color:#8f9;margin:10px 0 4px;font-size:.95rem}
  #err{color:#ff6b81;text-align:center;min-height:1.2em;font-size:.9rem}
  .spin{display:inline-block;width:16px;height:16px;border:3px solid #3a5cff;border-top-color:transparent;border-radius:50%;vertical-align:-3px;margin-right:8px;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .bar{height:6px;background:#1c1c26;border-radius:3px;overflow:hidden;max-width:420px;margin:6px auto}
  .bar > div{height:100%;width:0%;background:linear-gradient(90deg,#3a5cff,#2bb673);transition:width .2s}
</style>
</head>
<body>
<h1 style="text-align:center">ИИ-художник 🎨</h1>
<p class="sub" style="text-align:center">Версия 4 — с индикатором работы. Обработка идёт в самом телефоне.</p>

<div class="row" id="styles">
  <button class="pill on" data-s="anime">Аниме (лица)</button>
  <button class="pill" data-s="ghibli">Миядзаки</button>
  <button class="pill" data-s="shinkai">Синкай</button>
</div>

<div class="row" id="sizes">
  <button class="pill on" data-z="256">Ультра-быстро (256px)</button>
  <button class="pill" data-z="384">Быстро (384px)</button>
  <button class="pill" data-z="512">Качественно (512px)</button>
</div>

<canvas id="stage" width="256" height="256"></canvas>

<div class="bar"><div id="prog"></div></div>
<p id="status">Выберите фото из галереи</p>
<p id="err"></p>

<button class="big" id="pick">📂 Выбрать фото</button>
<button class="big" id="save">💾 Сохранить</button>
<input type="file" id="inp" accept="image/*" hidden>

<script>
const inp=document.getElementById('inp'), cv=document.getElementById('stage'),
ctx=cv.getContext('2d',{willReadFrequently:true}), st=document.getElementById('status'),
err=document.getElementById('err'), prog=document.getElementById('prog');
let style='anime', size=256, busy=false, lastReady=false;

document.querySelectorAll('#styles .pill').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#styles .pill').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); style=b.dataset.s; if(lastReady) apply(); });

document.querySelectorAll('#sizes .pill').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#sizes .pill').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); size=+b.dataset.z; if(lastReady) apply(); });

document.getElementById('pick').onclick=()=>{ err.textContent=''; inp.click(); };

inp.onchange=()=>{
  const f=inp.files && inp.files[0];
  if(!f){ err.textContent='Файл не выбран — попробуйте ещё раз.'; return; }
  st.innerHTML='<span class="spin"></span>Читаю файл: '+f.name;
  const r=new FileReader();
  r.onerror=()=>{ st.textContent=''; err.textContent='Не удалось прочитать файл. Попробуйте другой снимок.'; };
  r.onload=()=>{
    const img=new Image();
    img.onerror=()=>{ st.textContent=''; err.textContent='Браузер не смог открыть это изображение. Попробуйте JPG из камеры.'; };
    img.onload=()=>{
      st.innerHTML='<span class="spin"></span>Обрабатываю...';
      apply(img);
    };
    img.src=r.result;
  };
  r.readAsDataURL(f);
};

function apply(img){
  if(busy) return; busy=true; lastReady=false;
  err.textContent='';
  const t0=performance.now();
  // таймер, чтобы было видно: работает, а не висит
  const timer=setInterval(()=>{
    const s=((performance.now()-t0)/1000).toFixed(1);
    st.innerHTML='<span class="spin"></span>Обрабатываю... '+s+' сек';
    prog.style.width=Math.min(95,(performance.now()-t0)/3)+'%';
  },100);

  requestAnimationFrame(()=>{
    try{
      const iw=img?img.width:cv.width, ih=img?img.height:cv.height;
      const k=Math.min(size/iw,size/ih);
      const w=Math.max(1,Math.round(iw*k)), h=Math.max(1,Math.round(ih*k));
      cv.width=w; cv.height=h;
      if(img) ctx.drawImage(img,0,0,w,h);
      const d=ctx.getImageData(0,0,w,h), p=d.data;
      for(let i=0;i<p.length;i+=4){
        let r=p[i],g=p[i+1],b=p[i+2];
        const y=.299*r+.587*g+.114*b;
        if(style==='anime'){
          const q=64;
          p[i]=Math.round(r/q)*q; p[i+1]=Math.round(g/q)*q; p[i+2]=Math.round(b/q)*q;
          const edge=Math.abs(r-y)>42||Math.abs(g-y)>42||Math.abs(b-y)>42;
          if(edge){p[i]=20;p[i+1]=20;p[i+2]=30;}
        }else if(style==='ghibli'){
          p[i]=Math.min(255,y*1.08+28); p[i+1]=Math.min(255,y*1.02+12); p[i+2]=Math.min(255,y*.88);
        }else{
          p[i]=Math.min(255,r*1.18+14); p[i+1]=Math.min(255,g*1.02+4); p[i+2]=Math.min(255,b*1.22+26);
        }
      }
      ctx.putImageData(d,0,0);
      clearInterval(timer);
      const s=((performance.now()-t0)/1000).toFixed(1);
      st.textContent='Готово за '+s+' сек ✅';
      prog.style.width='100%';
      lastReady=true;
    }catch(e){
      clearInterval(timer);
      st.textContent='';
      err.textContent='Ошибка обработки: '+e.message;
    }
    busy=false;
  });
}

document.getElementById('save').onclick=()=>{
  if(!lastReady){ err.textContent='Сначала выберите фото и дождитесь результата.'; return; }
  err.textContent='';
  const a=document.createElement('a');
  a.download='ai-art.png'; a.href=cv.toDataURL('image/png'); a.click();
  st.textContent='Сохранено в загрузки ✅';
};
</script>
</body>
</html>
