<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ИИ-художник — настоящая нейросеть</title>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.17.3/dist/ort.min.js"></script>
<style>
body{margin:0;background:#0b0b10;color:#eee;font-family:system-ui,sans-serif;text-align:center;padding:10px}
h1{font-size:1.4rem;margin:6px 0}.sub{color:#8f9;font-size:.85rem;margin:0 0 10px}
.pill{padding:10px 14px;border-radius:24px;background:#2a2a34;color:#eee;font-size:.95rem;border:none;margin:4px}
.pill.on{background:#3b5bff}
#prog{height:5px;background:#222;border-radius:3px;overflow:hidden;margin:10px auto;max-width:520px;display:none}
#prog i{display:block;height:100%;width:40%;background:#3b5bff;border-radius:3px;animation:mv 1.2s infinite linear}
@keyframes mv{from{margin-left:-40%}to{margin-left:100%}}
#st{min-height:22px;font-size:.9rem;margin:6px 0}
#st.err{color:#ff5566}#st.ok{color:#22c55e}
canvas{max-width:96vw;max-height:52vh;background:#111;border-radius:10px}
.pick{background:#f43f5e;color:#fff;border:none;border-radius:24px;padding:14px 26px;font-size:1.05rem;margin:10px 4px}
.save{background:#22c55e;color:#062;border:none;border-radius:24px;padding:14px 26px;font-size:1.05rem;margin:10px 4px}
</style>
</head>
<body>
<h1>ИИ-художник 🎨</h1>
<p class="sub">Версия 9 — рабочие модели для всех стилей. Первое применение стиля качает модель.</p>
<div>
  <button class="pill on" data-s="face">Аниме (лица)</button>
  <button class="pill" data-s="jp">Японский аниме</button>
</div>
<div>
  <button class="pill" data-s="hayao">Миядзаки</button>
  <button class="pill" data-s="shinkai">Синкай</button>
</div>
<div id="prog"><i></i></div>
<div id="st">Выберите фото из галереи</div>
<canvas id="cv" width="512" height="512"></canvas>
<div>
  <button class="pick" id="pick">📂 Выбрать фото</button>
  <button class="save" id="save">💾 Сохранить</button>
</div>
<input type="file" id="file" accept="image/*" hidden>
<script>
const S = {
  face:   {n:'Аниме (лица)',  u:'https://cdn.jsdelivr.net/gh/josephrocca/anime-gan-v2-web@main/anime-gan-v2.onnx'},
  jp:     {n:'Японский аниме',u:'https://huggingface.co/vumichien/AnimeGANv3_JP_face/resolve/main/AnimeGANv3_JP_face.onnx'},
  hayao:  {n:'Миядзаки',      u:'https://huggingface.co/vumichien/AnimeGANv2_Hayao/resolve/main/AnimeGANv2_Hayao.onnx'},
  shinkai:{n:'Синкай',        u:'https://huggingface.co/vumichien/AnimeGANv2_Shinkai/resolve/main/AnimeGANv2_Shinkai.onnx'}
};
let style='face', srcImg=null, busy=false;
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const st=document.getElementById('st'), prog=document.getElementById('prog');
const sessions={};

function say(t,c){st.textContent=t; st.className=c||'';}
function busyOn(t){busy=true; prog.style.display='block'; say(t); startTimer();}
function busyOff(){busy=false; prog.style.display='none'; stopTimer();}

let t0=0,tm=0;
function startTimer(){t0=Date.now(); tm=setInterval(()=>{if(busy) say(st.textContent.split('...')[0]+'... '+((Date.now()-t0)/1000).toFixed(0)+' сек');},500);}
function stopTimer(){clearInterval(tm);}

document.querySelectorAll('.pill[data-s]').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.pill[data-s]').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); style=b.dataset.s;
  if(srcImg) process();
});

document.getElementById('pick').onclick=()=>document.getElementById('file').click();
document.getElementById('file').onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  say('Читаю файл: '+f.name);
  const r=new FileReader();
  r.onload=()=>{const im=new Image();
    im.onload=()=>{srcImg=im; process();};
    im.onerror=()=>say('Браузер не смог открыть это изображение','err');
    im.src=r.result;};
  r.onerror=()=>say('Не удалось прочитать файл','err');
  r.readAsDataURL(f);
};

async function getSession(key){
  if(sessions[key]) return sessions[key];
  busyOn('Скачиваю модель ('+S[key].n+')');
  try{
    const s=await ort.InferenceSession.create(S[key].u,{executionProviders:['wasm']});
    sessions[key]=s; busyOff(); return s;
  }catch(err){
    busyOff();
    say('Модель ('+S[key].n+') не скачалась. Проверь интернет, попробуй ещё раз или выбери «Аниме (лица)»','err');
    return null;
  }
}

async function process(){
  if(!srcImg||busy) return;
  const s=await getSession(style); if(!s) return;
  busyOn('Нейросеть рисует ('+S[style].n+')');
  await new Promise(r=>setTimeout(r,50));
  try{
    const N=512, off=document.createElement('canvas');
    off.width=N; off.height=N;
    const o=off.getContext('2d');
    const k=Math.max(N/srcImg.width,N/srcImg.height);
    o.drawImage(srcImg,(N-srcImg.width*k)/2,(N-srcImg.height*k)/2,srcImg.width*k,srcImg.height*k);
    const d=o.getImageData(0,0,N,N).data;
    const x=new Float32Array(3*N*N);
    for(let i=0;i<N*N;i++){
      x[i]=(d[i*4]/127.5)-1; x[N*N+i]=(d[i*4+1]/127.5)-1; x[2*N*N+i]=(d[i*4+2]/127.5)-1;
    }
    const tensor=new ort.Tensor('float32',x,[1,3,N,N]);
    const feeds={};
    s.inputNames.forEach(name=>feeds[name]=tensor);
    const out=await s.run(feeds);
    const y=out[s.outputNames[0]].data;
    const id=ctx.createImageData(N,N);
    for(let i=0;i<N*N;i++){
      id.data[i*4]  =Math.min(255,Math.max(0,(y[i]+1)*127.5));
      id.data[i*4+1]=Math.min(255,Math.max(0,(y[N*N+i]+1)*127.5));
      id.data[i*4+2]=Math.min(255,Math.max(0,(y[2*N*N+i]+1)*127.5));
      id.data[i*4+3]=255;
    }
    ctx.putImageData(id,0,0);
    busyOff(); say('Готово за '+((Date.now()-t0)/1000).toFixed(1)+' сек ✅','ok');
  }catch(err){
    busyOff(); say('Ошибка нейросети: '+err.message,'err');
  }
}

document.getElementById('save').onclick=()=>{
  cv.toBlob(b=>{
    if(!b){say('Сначала выберите фото и дождитесь результата','err');return;}
    const a=document.createElement('a');
    a.href=URL.createObjectURL(b); a.download='anime.png'; a.click();
  });
};
</script>
</body>
</html>
