<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ИИ-художник</title>
<style>
  body{margin:0;background:#0b0b0f;color:#fff;font-family:system-ui,Arial,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:14px;box-sizing:border-box}
  h1{font-size:1.4rem;margin:6px 0 2px}
  .sub{color:#8f9; font-size:.85rem;margin-bottom:10px;text-align:center}
  .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:6px 0}
  .pill{border:none;border-radius:999px;padding:12px 16px;font-size:.95rem;color:#fff;background:#2a2a33}
  #styles .pill.on{background:#3b4cff}
  #sizes .pill.on{background:#2ecc71;color:#063}
  #wrap{width:100%;max-width:520px;aspect-ratio:1/1;background:#000;border-radius:14px;margin:10px 0;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
  canvas{max-width:100%;max-height:100%;display:none}
  #hint{color:#2ecc71;font-size:1rem;text-align:center;padding:12px}
  #status{color:#9aa;font-size:.9rem;min-height:1.2em;margin:4px 0;text-align:center}
  .big{width:min(92vw,420px);padding:15px;border-radius:999px;font-size:1.1rem;border:none;margin:6px 0}
  #pick{background:#ff4d6d;color:#fff}
  #save{background:#2ecc71;color:#063}
</style>
</head>
<body>
<h1>ИИ-художник 🎨</h1>
<div class="sub">Выбери стиль и размер, потом фото — обработка идёт прямо в браузере</div>

<div class="row" id="styles">
  <button class="pill on" id="bAnime">Аниме (лица)</button>
  <button class="pill" id="bGhibli">Миядзаки</button>
  <button class="pill" id="bShinkai">Синкай</button>
</div>

<div class="row" id="sizes">
  <button class="pill" id="b256">Ультра (256px)</button>
  <button class="pill on" id="b384">Быстро (384px)</button>
  <button class="pill" id="b512">Качественно (512px)</button>
</div>

<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="hint">Выберите фото из галереи</div>
</div>
<div id="status"></div>

<button class="big" id="pick">📂 Выбрать фото</button>
<button class="big" id="save">💾 Сохранить</button>
<input type="file" id="file" accept="image/*" hidden>

<script>
const S = {style:'anime', size:384, img:null};
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const hint = document.getElementById('hint');
const statusEl = document.getElementById('status');

function status(t){ statusEl.textContent = t; }
function showHint(t){ hint.textContent = t; hint.style.display='block'; }

function markActive(rowId, btn){
  document.querySelectorAll('#'+rowId+' .pill').forEach(b => b.classList.toggle('on', b===btn));
}

document.getElementById('bAnime').onclick  = e => { S.style='anime';   markActive('styles', e.target); run(); };
document.getElementById('bGhibli').onclick  = e => { S.style='ghibli';  markActive('styles', e.target); run(); };
document.getElementById('bShinkai').onclick = e => { S.style='shinkai'; markActive('styles', e.target); run(); };
document.getElementById('b256').onclick = e => { S.size=256; markActive('sizes', e.target); run(); };
document.getElementById('b384').onclick = e => { S.size=384; markActive('sizes', e.target); run(); };
document.getElementById('b512').onclick = e => { S.size=512; markActive('sizes', e.target); run(); };

document.getElementById('pick').onclick = () => document.getElementById('file').click();
document.getElementById('file').onchange = e => {
  const f = e.target.files[0];
  if(!f) return;
  const img = new Image();
  const url = URL.createObjectURL(f);
  img.onload = () => { S.img = img; run(); };
  img.onerror = () => status('Не удалось открыть фото, попробуй другое');
  img.src = url;
};

function run(){
  if(!S.img){ showHint('Выберите фото из галереи'); return; }
  const t0 = performance.now();
  status('Обработка…');
  setTimeout(() => {
    try{
      render();
      const sec = ((performance.now()-t0)/1000).toFixed(1);
      status('Готово за ' + sec + ' сек · стиль: ' +
        (S.style==='anime'?'Аниме':S.style==='ghibli'?'Миядзаки':'Синкай') +
        ' · ' + S.size + 'px');
    }catch(err){
      status('Ошибка: ' + err.message);
    }
  }, 30);
}

function render(){
  const img = S.img, w = S.size;
  const h = Math.max(1, Math.round(w * img.height / img.width));
  cv.width = w; cv.height = h;
  cv.style.display = 'block';
  hint.style.display = 'none';

  ctx.filter = S.style==='anime'  ? 'saturate(1.25) contrast(1.05)' :
               S.style==='ghibli' ? 'saturate(1.05) brightness(1.1) contrast(0.95)' :
                                    'saturate(1.5) contrast(1.15) brightness(1.02)';
  ctx.drawImage(img, 0, 0, w, h);
  ctx.filter = 'none';

  if(S.style === 'anime')   styleAnime(w, h);
  if(S.style === 'ghibli')  styleGhibli(w, h);
  if(S.style === 'shinkai') styleShinkai(w, h);
}

/* --- утилиты --- */
function makeTmp(w, h){
  const t = document.createElement('canvas');
  t.width = w; t.height = h;
  return t;
}

function quantize(d, levels){
  const step = 255 / (levels - 1);
  for(let i = 0; i < d.length; i += 4){
    d[i]   = Math.round(d[i]   / step) * step;
    d[i+1] = Math.round(d[i+1] / step) * step;
    d[i+2] = Math.round(d[i+2] / step) * step;
  }
}

function bloom(w, h, strength){
  const t = makeTmp(w, h), tc = t.getContext('2d');
  tc.filter = 'blur(' + (w/20) + 'px) brightness(1.4)';
  tc.drawImage(cv, 0, 0);
  tc.filter = 'none';
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = strength;
  ctx.drawImage(t, 0, 0);
  ctx.restore();
}

function tint(w, h, color, mode){
  ctx.save();
  ctx.globalCompositeOperation = mode;
  ctx.fillStyle = color;
  ctx.fillRect(0, 0, w, h);
  ctx.restore();
}

/* --- стили --- */
function styleAnime(w, h){
  // 1) сглаженная копия + плоские цвета
  const t = makeTmp(w, h), tc = t.getContext('2d');
  tc.filter = 'blur(' + Math.max(1.5, w/200).toFixed(1) + 'px)';
  tc.drawImage(cv, 0, 0);
  tc.filter = 'none';
  const data = tc.getImageData(0, 0, w, h);
  quantize(data.data, 6); // плоские "аниме" цвета

  // 2) контуры: Собель по исходнику
  const src = ctx.getImageData(0, 0, w, h).data;
  const lum = new Float32Array(w * h);
  for(let i = 0, p = 0; i < src.length; i += 4, p++){
    lum[p] = 0.299*src[i] + 0.587*src[i+1] + 0.114*src[i+2];
  }
  const d = data.data;
  for(let y = 1; y < h-1; y++){
    for(let x = 1; x < w-1; x++){
      const p = y*w + x;
      const gx = -lum[p-w-1] - 2*lum[p-1] - lum[p+w-1] + lum[p-w+1] + 2*lum[p+1] + lum[p+w+1];
      const gy = -lum[p-w-1] - 2*lum[p-w] - lum[p-w+1] + lum[p+w-1] + 2*lum[p+w] + lum[p+w+1];
      const mag = Math.sqrt(gx*gx + gy*gy);
      const e = Math.max(0, (mag - 40) / 160);
      if(e > 0){
        const k = 1 - 0.65 * Math.min(1, e);
        const i = p * 4;
        d[i] *= k; d[i+1] *= k; d[i+2] *= k;
      }
    }
  }
  ctx.putImageData(data, 0, 0);
}

function styleGhibli(w, h){
  // мягкие тёплые тона, лёгкая "акварельность"
  const data = ctx.getImageData(0, 0, w, h);
  quantize(data.data, 12);
  ctx.putImageData(data, 0, 0);
  bloom(w, h, 0.30);
  tint(w, h, 'rgba(255,214,170,0.18)', 'overlay');
}

function styleShinkai(w, h){
  // сочные цвета, свечение, лёгкий холодный оттенок
  bloom(w, h, 0.45);
  tint(w, h, 'rgba(60,140,255,0.10)', 'soft-light');
  const data = ctx.getImageData(0, 0, w, h);
  quantize(data.data, 16);
  ctx.putImageData(data, 0, 0);
}

/* --- сохранение --- */
document.getElementById('save').onclick = () => {
  if(!S.img){ showHint('Сначала выбери фото 🙂'); return; }
  cv.toBlob(b => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = 'art-' + S.style + '-' + S.size + '.png';
    a.click();
  }, 'image/png');
};
</script>
</body>
</html>
